name: anythingllm

networks:
  anything-llm:
    driver: bridge

volumes:
  anything-llm-data:
    external: true

services:
  anything-llm:
    container_name: anythingllm
    build:
      context: ../.
      dockerfile: ./docker/Dockerfile
      args:
        ARG_UID: ${UID:-1000}
        ARG_GID: ${GID:-1000}
    cap_add:
      - SYS_ADMIN
    volumes:
      - "./.env:/app/server/.env"
      - "anything-llm-data:/app/server/storage"
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "3002:3001"
    env_file:
      - .env
    networks:
      - anything-llm
    extra_hosts:
      - "host.docker.internal:host-gateway"
